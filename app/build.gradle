plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.antite.browser'
    compileSdkVersion 'android-37.2'

    defaultConfig {
        applicationId 'dev.antite.browser'
        minSdk 30
        targetSdk 36
        versionCode shellVersionCode as int
        versionName '0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // One APK for every ABI Mozilla builds GeckoView for; the shell's own native code is tiny.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        def publisherKey = rootProject.file('keys/publisher.pub.pem').readLines().findAll { !it.startsWith('-----') }.join('')
        buildConfigField 'String', 'PUBLISHER_KEY', "\"$publisherKey\""
        buildConfigField 'String', 'ENGINE_INDEX_URL', "\"$engineIndexUrl\""
    }

    def keysDir = findProperty('antite.keysDir')
    signingConfigs {
        if (keysDir) {
            release {
                def password = new File(keysDir, 'password').text.trim()
                storeFile new File(keysDir, 'apk.p12')
                storeType 'pkcs12'
                storePassword password
                keyAlias 'antite'
                keyPassword password
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keysDir) signingConfig signingConfigs.release
        }
        // A debug build signed with the release key: installs over a release build without losing data, so a phone
        // with the published Antite can be debugged (run-as, logs of the app process).
        logs {
            initWith debug
            if (keysDir) signingConfig signingConfigs.release
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

configurations {
    geckoAar { transitive = false }
}

dependencies {
    implementation project(':engine-api')
    // GeckoView's own dependencies stay in the shell; GeckoView itself comes with the engine package.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.annotation:annotation-experimental:1.6.0'
    implementation 'androidx.collection:collection:1.6.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'com.google.android.gms:play-services-fido:21.3.1'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.media3:media3-datasource:1.11.1'
    implementation 'androidx.media3:media3-decoder:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    geckoAar "org.mozilla.geckoview:geckoview:$geckoviewVersion@aar"
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'sh.calvin.reorderable:reorderable:3.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

abstract class GeckoManifestTask extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getAar()

    @OutputFile
    abstract RegularFileProperty getOutputManifest()

    @TaskAction
    void run() {
        def src = new java.util.zip.ZipFile(aar.singleFile).withCloseable { z ->
            z.getInputStream(z.getEntry('AndroidManifest.xml')).getText('UTF-8')
        }
        def perms = (src =~ /<uses-permission[^>]*\/>/).collect { it }
        def open = (src =~ /<application[^>]*>/)
        open.find()
        def body = src.substring(open.end(), src.indexOf('</application>'))
        outputManifest.get().asFile.text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools">
${perms.join('\n')}
    <application>
$body
    </application>
</manifest>
"""
    }
}

def geckoManifest = tasks.register('geckoManifest', GeckoManifestTask) {
    aar.from(configurations.geckoAar)
}

// Interface strings live in l10n/<language>/*.ftl (docs/decisions/0005-localization.md). This generates object T from
// the Russian files: a property per message, a function with named parameters per message with variables.
abstract class L10nKeysTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSource()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    static String camel(String id) {
        def parts = id.split(/[-_]/)
        return parts[0] + parts.drop(1).collect { it.capitalize() }.join('')
    }

    @TaskAction
    void run() {
        def entries = new LinkedHashMap<String, TreeSet<String>>()
        source.get().asFile.listFiles().findAll { it.name.endsWith('.ftl') }.sort { it.name }.each { f ->
            String current = null
            f.readLines('UTF-8').each { line ->
                def m = line =~ /^([a-zA-Z][a-zA-Z0-9_-]*) *=/
                if (m.find()) {
                    current = m.group(1)
                    entries[current] = new TreeSet<String>()
                } else if (line && !line.startsWith(' ') && !line.startsWith('}')) {
                    current = null
                }
                if (current) (line =~ /\{\s*\$([a-zA-Z][a-zA-Z0-9_-]*)/).each { entries[current] << it[1] }
            }
        }
        def out = new StringBuilder('package dev.antite.browser.l10n\n\n// Generated from l10n/ru/*.ftl by the l10nKeys task.\nobject T {\n')
        entries.each { id, vars ->
            if (vars.isEmpty()) {
                out << "    val ${camel(id)}: String get() = L10n.format(\"$id\")\n"
            } else {
                def params = vars.collect { "${camel(it)}: Any?" }.join(', ')
                def map = vars.collect { "\"$it\" to ${camel(it)}" }.join(', ')
                out << "    fun ${camel(id)}($params): String = L10n.format(\"$id\", mapOf($map))\n"
            }
        }
        out << '}\n'
        def dir = new File(outputDir.get().asFile, 'dev/antite/browser/l10n')
        dir.mkdirs()
        new File(dir, 'T.kt').write(out.toString(), 'UTF-8')
    }
}

abstract class L10nAssetsTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSource()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def root = outputDir.get().asFile
        root.deleteDir()
        def target = new File(root, 'l10n')
        source.get().asFile.eachFileRecurse { f ->
            if (f.isFile() && f.name.endsWith('.ftl')) {
                def to = new File(target, source.get().asFile.toPath().relativize(f.toPath()).toString())
                to.parentFile.mkdirs()
                to.bytes = f.bytes
            }
        }
    }
}

def l10nKeys = tasks.register('l10nKeys', L10nKeysTask) {
    source = rootProject.layout.projectDirectory.dir('l10n/ru')
}

def l10nAssets = tasks.register('l10nAssets', L10nAssetsTask) {
    source = rootProject.layout.projectDirectory.dir('l10n')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.manifests.addGeneratedManifestFile(geckoManifest, { it.outputManifest })
        variant.sources.kotlin.addGeneratedSourceDirectory(l10nKeys, { it.outputDir })
        variant.sources.assets.addGeneratedSourceDirectory(l10nAssets, { it.outputDir })
    }
}
