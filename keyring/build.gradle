// Keys and encrypted formats: plain Kotlin on the JVM, no Android on the classpath, so nothing of the interface or
// the platform can reach into it. The Keystore and Argon2 come from the app through KeyRing.DeviceKeys and KeyRing.Kdf.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-test-fixtures'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Android has org.json built in; the key files are JSON and must keep their format.
    compileOnly 'org.json:json:20260814'
    testImplementation 'org.json:json:20260814'
    testImplementation 'junit:junit:4.13.2'
}

// The JVM tests run the ciphers in a host build of the native key core.
def hostCore = layout.buildDirectory.dir("keycore-host")
tasks.register("hostKeyCore", Exec) {
    def src = rootProject.file("keycore")
    inputs.dir(src)
    outputs.dir(hostCore)
    commandLine "sh", "-c", "cmake -S '${src}' -B '${hostCore.get().asFile}' -DCMAKE_BUILD_TYPE=Release -DKEYCORE_FAULTS=ON >/dev/null && cmake --build '${hostCore.get().asFile}' >/dev/null"
}
tasks.withType(Test).configureEach {
    dependsOn "hostKeyCore"
    systemProperty "antite.keycore", hostCore.get().file("libkeycore.so").asFile.path
    jvmArgs "--enable-native-access=ALL-UNNAMED"
}
