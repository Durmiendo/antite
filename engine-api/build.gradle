plugins {
    id 'com.android.library'
}

android {
    namespace 'dev.antite.engine'
    compileSdkVersion 'android-37.2'

    defaultConfig {
        minSdk 30
        buildConfigField 'int', 'ENGINE_API', engineApi
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
