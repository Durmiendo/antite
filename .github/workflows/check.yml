name: Check

on:
  push:
    branches: [main]
    tags: ['shell-*', 'engine-*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: e2e scripts import only the shared modules
        run: |
          shared=" device server nav engine vault frames prefs "
          bad=0
          for f in tools/e2e/*.py; do
            for m in $(sed -nE 's/^(from ([a-z_]+) import|import ([a-z_]+)).*/\2\3/p' "$f"); do
              if [ -f "tools/e2e/$m.py" ] && [[ "$shared" != *" $m "* ]]; then echo "$f imports the script $m"; bad=1; fi
            done
          done
          exit $bad
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null
      - name: Build and unit tests
        run: ./gradlew --no-daemon :archcheck:test :keyring:test testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest :engine-gecko:adapterPackage
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: app/build/reports/tests
